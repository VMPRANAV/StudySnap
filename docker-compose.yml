version: '3.8'

services:
  # 1. FastAPI AI Service
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    env_file: .env
    container_name: study_snap_ai
    restart: always
    environment:
      - MONGO_URI=${MONGO_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 450M # Strictly caps RAM to prevent EC2 from freezing
    networks:
      - studysnap_network

  # 2. Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    container_name: study_snap_backend
    restart: always
    depends_on:
      - ai_service # Ensures the AI service starts first
    environment:
      - MONGO_URI=${MONGO_URI}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AI_SERVICE_URL=http://ai_service:8000 # Internal Docker network URL
      - PORT=5000
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 400M # Balanced for your login and data management
    networks:
      - studysnap_network

networks:
  studysnap_network:
    driver: bridge